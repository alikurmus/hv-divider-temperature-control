name: hv-divider-pid
# conda-forge only. The Anaconda "defaults" channel is intentionally omitted
# (Miniforge does not use it, and mixing channels slows/complicates solving).
# Do not commit a machine-specific "prefix:" line.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - matplotlib
  - jupyterlab
  - ipykernel
  - ipywidgets
  - ipympl
